// Generador de QR (byte, corrección M, versiones 1-3). Escrito para TAG; sin dependencias.
const QR=(()=>{
 const EXP=new Array(512),LOG=new Array(256);
 {let x=1;for(let i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=0x11d}for(let i=255;i<512;i++)EXP[i]=EXP[i-255]}
 const mul=(a,b)=>a&&b?EXP[LOG[a]+LOG[b]]:0;
 const V=[null,{n:21,d:16,e:10},{n:25,d:28,e:16,a:18},{n:29,d:44,e:26,a:22}];
 function rs(data,ec){let g=[1];for(let i=0;i<ec;i++){const ng=new Array(g.length+1).fill(0);for(let j=0;j<g.length;j++){ng[j]^=g[j];ng[j+1]^=mul(g[j],EXP[i])}g=ng}
  const res=new Array(ec).fill(0);for(const b of data){const f=b^res[0];res.shift();res.push(0);if(f)for(let i=0;i<ec;i++)res[i]^=mul(g[i+1],f)}return res}
 function build(str){
  const bytes=Array.from(new TextEncoder().encode(str));let v=0;
  for(let i=1;i<=3;i++)if(bytes.length<=V[i].d-2){v=i;break}
  if(!v)throw new Error('QR: texto demasiado largo');
  const {n,d,e}=V[v],bits=[],put=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>>i)&1)};
  put(4,4);put(bytes.length,8);bytes.forEach(b=>put(b,8));
  for(let i=0;i<4&&bits.length<d*8;i++)bits.push(0);while(bits.length%8)bits.push(0);
  const cw=[];for(let i=0;i<bits.length;i+=8){let x=0;for(let j=0;j<8;j++)x=x<<1|bits[i+j];cw.push(x)}
  for(let p=0;cw.length<d;p^=1)cw.push(p?0x11:0xec);
  const all=cw.concat(rs(cw,e));
  const M=Array.from({length:n},()=>new Array(n).fill(0)),F=Array.from({length:n},()=>new Array(n).fill(false));
  const fm=(x,y,b)=>{M[y][x]=b?1:0;F[y][x]=true};
  const finder=(cx,cy)=>{for(let dy=-1;dy<=7;dy++)for(let dx=-1;dx<=7;dx++){const x=cx+dx,y=cy+dy;if(x<0||y<0||x>=n||y>=n)continue;
   const on=dx>=0&&dx<=6&&dy>=0&&dy<=6&&(dx===0||dx===6||dy===0||dy===6||(dx>=2&&dx<=4&&dy>=2&&dy<=4));fm(x,y,on)}};
  finder(0,0);finder(n-7,0);finder(0,n-7);
  for(let i=8;i<n-8;i++){fm(i,6,i%2===0);fm(6,i,i%2===0)}
  if(V[v].a){const a=V[v].a;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)fm(a+dx,a+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}
  for(let i=0;i<9;i++){if(i!==6){F[8][i]=true;F[i][8]=true}}for(let i=0;i<8;i++){F[8][n-1-i]=true;F[n-1-i][8]=true}
  fm(8,n-8,1);
  const data=[];all.forEach(b=>{for(let j=7;j>=0;j--)data.push((b>>>j)&1)});
  let k=0;
  for(let right=n-1;right>=1;right-=2){if(right===6)right=5;
   for(let vert=0;vert<n;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?n-1-vert:vert;
    if(!F[y][x]&&k<data.length){M[y][x]=data[k++]}}}
  const MASKS=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
  const fmt=(T,mask)=>{const dd=mask;let rem=dd;for(let i=0;i<10;i++)rem=(rem<<1)^((rem>>>9)*0x537);const bits=(dd<<10|rem)^0x5412,gb=i=>(bits>>>i)&1;
   for(let i=0;i<=5;i++)T.fm(8,i,gb(i));T.fm(8,7,gb(6));T.fm(8,8,gb(7));T.fm(7,8,gb(8));for(let i=9;i<15;i++)T.fm(14-i,8,gb(i));
   for(let i=0;i<8;i++)T.fm(n-1-i,8,gb(i));for(let i=8;i<15;i++)T.fm(8,n-15+i,gb(i));T.fm(8,n-8,1)};
  const pen=G=>{let p=0;
   for(let y=0;y<n;y++)for(const get of [(i)=>G[y][i],(i)=>G[i][y]]){let run=1;for(let i=1;i<n;i++){if(get(i)===get(i-1))run++;else{if(run>=5)p+=3+run-5;run=1}}if(run>=5)p+=3+run-5;
    for(let i=0;i+10<n;i++){let a=0;for(let j=0;j<11;j++)a=a<<1|get(i+j);if(a===0x5d0||a===0x05d)p+=40}}
   for(let y=0;y<n-1;y++)for(let x=0;x<n-1;x++){const c=G[y][x];if(c===G[y][x+1]&&c===G[y+1][x]&&c===G[y+1][x+1])p+=3}
   let dark=0;G.forEach(r=>r.forEach(c=>dark+=c));p+=(Math.ceil(Math.abs(dark*20-n*n*10)/(n*n))-1)*10;return p};
  let best=null,bp=1e9;
  for(let m=0;m<8;m++){const G=M.map(r=>r.slice());for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!F[y][x]&&MASKS[m](x,y))G[y][x]^=1;
   fmt({fm:(x,y,b)=>{G[y][x]=b?1:0}},m);const s=pen(G);if(s<bp){bp=s;best=G}}
  return best;
 }
 function svg(text,label){try{const G=build(text),n=G.length,m=4;let d='';

  return '<svg viewBox="0 0 '+(n+2*m)+' '+(n+2*m)+'" role="img" aria-label="'+(label||'Código QR')+'" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>'}catch(e){return ''}}
 return {build,svg};
})();

const IC_NO='<svg viewBox="0 0 100 100" width="160" height="160" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#fff" stroke-width="6"/><path d="M32 32l36 36M68 32L32 68" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/></svg>';
function res(ok,t,d){DR.res={ok,t,d};showRes()}
function showRes(){const R=DR.res,o=$('#ovl');clearTimeout(DR.tm);
 if(!R){o.style.display='none';o.innerHTML='';return}
 o.className='ovl '+(R.ok?'g':'r');o.style.display='flex';o.setAttribute('role','alert');
 o.innerHTML=(R.ok?IC_OK:IC_NO)+`<div class="ot">${esc(R.t)}</div>${R.d?`<div class="od">${esc(R.d)}</div>`:''}<button class="obtn" onclick="resClose()" autofocus>${R.ok?'Siguiente':'Reintentar'}</button>`;
 if(R.ok)DR.tm=setTimeout(resClose,1600)}
function resClose(){DR.res=null;DR.ign=Date.now()+1200;showRes()}
// --- validación ---
function dScan(code,src){
 const v=String(code||($('#dc')||{}).value||'').trim().toUpperCase();if(!v)return;
 if(DR.res||(src==='cam'&&Date.now()<DR.ign))return;
 if(!doorAuth()){gateOut();return}
 const id=DR.ev,e=evOf(id);S.scans=S.scans||[];DR.msg=null;
 if(!/^EP-[A-Z0-9]{6}$/.test(v)){render();res(false,'QR no reconocido','Ese código no es una entrada de TAG.');return}
 let r,t,d;
 if(dOn()){
  const x=S.tix.find(q=>q.id===v);
  if(!x){r='invalid';t='Entrada no encontrada';d='Este código no existe en TAG o fue reemplazado.'}
  else if(x.ev!==id){r='invalid';t='Es de otro evento';d='Esta entrada es para: '+((evOf(x.ev)||{}).name||'otro evento')+'.'}
  else if(x.used){const f=S.scans.filter(q=>q.tk===v&&q.r==='ok').pop();r='dup';t='Ya ingresó';d='Esta entrada ya se usó'+(f?' a las '+hhmm(f.ts):'')+'. Puede ser una copia del QR.'}
  else if(x.listed){r='listed';t='Entrada anulada';d='Esta entrada fue puesta en reventa o reemplazada.'}
  else{x.used=true;r='ok';t=x.owner.name;d=((e.tandas[x.t]||{}).n||'')+(e.minAge?' · Pedí cédula (+'+e.minAge+')':'')}
  S.scans.push({tk:v,ev:id,ts:Date.now(),r});save();
 }else{
  const sn=dSnap(id);
  if(!sn){render();res(false,'Sin lista descargada','No hay conexión. Conectate y tocá "Descargar lista" antes del evento.');return}
  const it=sn.list[v];
  if(!it){r='invalid';t='Entrada no encontrada';d='No está en la lista de este evento (modo sin conexión).'}
  else if(it.u){r='dup';t='Ya ingresó';d='Esta entrada ya se usó'+(it.at?' a las '+hhmm(it.at):'')+'. Puede ser una copia del QR.'}
  else{it.u=1;it.at=Date.now();r='ok';t=it.n;d=it.t+(e.minAge?' · Pedí cédula (+'+e.minAge+')':'')+' · sin conexión';dSet('ep_door_snap_'+id,sn)}
  const q=dQ();q.push({tk:v,ev:id,ts:Date.now(),r});dSet('ep_door_q',q);
 }
 render();res(r==='ok',t,d)}
// --- sin conexión ---
function dSim(){DR.sim=!DR.sim;DR.msg=null;if(dOn()&&dQ().length)dSync();else render()}
function dSnapNow(){if(!dOn()){DR.msg={k:'bad',t:'Necesitás conexión para descargar la lista.'};render();return}
 const id=DR.ev,e=evOf(id),list={};
 S.tix.filter(x=>x.ev===id&&!x.listed).forEach(x=>{list[x.id]={n:x.owner.name,t:(e.tandas[x.t]||{}).n||'',u:x.used?1:0}});
 dSet('ep_door_snap_'+id,{ts:Date.now(),list});DR.msg={k:'info',t:'Lista descargada: '+Object.keys(list).length+' entradas. Ya podés trabajar sin señal.'};render()}
function dSync(){if(!dOn())return;const q=dQ();if(!q.length){render();return}
 let ok=0,cf=0;S.scans=S.scans||[];
 q.forEach(s=>{if(s.r==='ok'){const x=S.tix.find(t=>t.id===s.tk);
   if(x&&!x.used){x.used=true;S.scans.push({tk:s.tk,ev:s.ev,ts:s.ts,r:'ok',off:1});ok++}
   else{S.scans.push({tk:s.tk,ev:s.ev,ts:s.ts,r:'dup',off:1});cf++}}
  else S.scans.push({tk:s.tk,ev:s.ev,ts:s.ts,r:s.r,off:1})});
 dSet('ep_door_q',[]);save();
 DR.msg={k:cf?'warn':'info',t:'Sincronizado: '+ok+' ingresos confirmados'+(cf?' y '+cf+' conflicto(s): entradas que ya habían ingresado por otra puerta mientras estabas sin señal.':'.')};render()}
function dOther(){const x=S.tix.find(t=>t.ev===DR.ev&&!t.used&&!t.listed);if(!x)return;x.used=true;S.scans=S.scans||[];S.scans.push({tk:x.id,ev:DR.ev,ts:Date.now(),r:'ok'});save();DR.msg={k:'info',t:'Demo: la entrada '+x.id+' ingresó por otra puerta (con conexión). Tu celular todavía no lo sabe.'};render()}
addEventListener('online',()=>{if(view==='door'&&dQ().length)dSync();else if(view==='door')render()});
addEventListener('offline',()=>{if(view==='door')render()});
function vDoor(){
 if(!doorAuth())return `<h1 style="font-size:clamp(26px,6vw,40px);margin:10px 0 6px;max-width:none">Puerta</h1><p class="lead">Ingresá el código de puerta que te dio el organizador para habilitar el escaneo.</p>
 <form class="panel" style="max-width:380px" onsubmit="doorIn();return false"><label for="dk">Código de puerta</label><input id="dk" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off" style="font-size:26px;letter-spacing:.2em;text-align:center"><div id="dm" class="msg" style="color:var(--bad)" role="alert"></div><button class="btn" style="width:100%;margin-top:10px">Entrar</button></form>`;
 const e=evOf(DR.ev),on=dOn(),sn=dSnap(DR.ev),q=dQ().filter(s=>s.ev===DR.ev),M=DR.msg,valid=S.tix.filter(x=>x.ev===DR.ev&&!x.used&&!x.listed).slice(0,4),
 ing=(S.scans||[]).filter(x=>x.ev===DR.ev&&x.r==='ok').length+q.filter(s=>s.r==='ok').length;
 return `${DR.org?'<p><a href="#" onclick="doorBack();return false">← Volver</a></p>':''}
 <div class="row" style="align-items:flex-start;gap:10px"><div><h1 style="font-size:clamp(26px,6vw,40px);margin:6px 0;max-width:none">Puerta</h1><p class="lead" style="margin-bottom:10px">${esc(e.name)} · ${e.date} · ${e.time} hs</p></div><button class="btn ghost sm" onclick="gateOut()">Salir</button></div>
 ${DR.cam?`<div class="cam"><video id="cv" playsinline muted autoplay></video><div class="frame"></div></div><p class="note" style="text-align:center;margin:0 0 8px">Apuntá al QR de la entrada</p><button class="btn ghost sm" onclick="camStop();render()">Apagar cámara</button>`
 :`<div class="panel" style="text-align:center"><button class="btn" style="width:100%;padding:18px;font-size:19px" onclick="camStart()">Activar cámara y escanear</button>${DR.cerr?`<p class="msg" style="color:var(--bad)" role="alert">${esc(DR.cerr)}</p>`:''}</div>`}
 <details style="margin:12px 0" ${DR.cerr?'open':''}><summary>Escribir el código a mano</summary><form style="display:flex;gap:10px;margin-top:8px" onsubmit="dScan();return false"><input id="dc" placeholder="EP-XXXXXX" autocapitalize="characters" autocomplete="off" aria-label="Código de la entrada"><button class="btn">Validar</button></form></details>
 ${M?`<div class="dres ${M.k}" role="status">${esc(M.t)}</div>`:''}
 <div class="stats" style="margin:12px 0"><div class="stat"><span class="mute">Ingresaron</span><b>${ing}</b></div><div class="stat"><span class="mute">Por sincronizar</span><b>${q.length}</b></div></div>
 ${q.length?`<button class="btn" style="width:100%" onclick="dSync()" ${on?'':'disabled'}>${on?'Sincronizar ahora':'Sincronizá cuando vuelva la señal'}</button>`:''}
 <div class="panel" style="margin-top:14px"><div class="row"><span class="tag ${on?'ok':''}" style="font-size:14px">${on?'● En línea':'● Sin conexión · modo local'}</span><label class="chk"><input type="checkbox" ${DR.sim?'checked':''} onchange="dSim()"> Simular sin señal (demo)</label></div>
 <p class="note" style="margin-top:10px">${sn?'Lista descargada a las '+hhmm(sn.ts)+' · '+Object.keys(sn.list).length+' entradas.':'Todavía no descargaste la lista para trabajar sin señal.'} <button class="btn ghost sm" onclick="dSnapNow()" ${on?'':'disabled'}>${sn?'Actualizar lista':'Descargar lista'}</button></p>
 <p class="note">Sin señal, cada celular valida con la lista que descargó: dos puertas distintas podrían dejar pasar la misma entrada hasta que sincronicen. Al reconectar, TAG detecta esos casos y te avisa.</p></div>
 <div class="panel" style="margin-top:14px"><b>Prueba rápida (demo)</b><p class="note">Entradas válidas de este evento, tocá una para simular el escaneo:</p><div style="display:flex;gap:8px;flex-wrap:wrap">${valid.map(x=>`<button class="dchip" onclick="dScan('${x.id}')">${x.id}</button>`).join('')||'<span class="mute">No hay entradas vendidas. Comprá una desde Eventos, o cargá las de prueba en Mis entradas.</span>'}</div>
 ${valid.length?`<p class="note" style="margin-top:10px"><button class="dchip" onclick="dOther()">Demo: otra puerta deja entrar la primera</button></p>`:''}</div>`}
function chk(){const v=$('#cc').value.trim().toUpperCase(),x=S.tix.find(t=>t.id===v),m=$('#cm');S.scans=S.scans||[];
 const lg=(r,ev)=>{S.scans.push({tk:v,ev:ev||0,ts:Date.now(),r});save()};
 if(!x){m.style.color='var(--bad)';m.textContent='Código no encontrado o reemplazado por una transferencia.';lg('invalid');return}
 if(x.used){m.style.color='var(--bad)';m.textContent='Esta entrada ya fue usada.';lg('dup',x.ev);return}
 if(x.listed){m.style.color='var(--bad)';m.textContent='Esta entrada está en reventa y no es válida hasta que se retire.';lg('listed',x.ev);return}
 const e=evOf(x.ev);x.used=true;lg('ok',x.ev);m.style.color='var(--ok)';m.textContent='Válida. A nombre de '+x.owner.name+'.'+(e.minAge?' Verificá cédula: evento +'+e.minAge+'.':'')}
$('#app').addEventListener('click',ev=>{const a=ev.target.closest('.ev,.evc');if(a&&!ev.target.closest('button,a'))location.hash='#e-'+a.dataset.id});
let LSY=0,WD=false;const isD=()=>/^#[el]-/.test(location.hash);addEventListener('scroll',()=>{if(!isD())LSY=scrollY},{passive:true});addEventListener('hashchange',()=>{const d=isD(),back=WD&&!d;WD=d;setTimeout(()=>scrollTo({top:back?LSY:0,behavior:back?'instant':'smooth'}),0)});
addEventListener('hashchange',render);render();
(function(){const R=document.documentElement,sp=document.getElementById('spl');
 const end=()=>{R.classList.remove('spl');sp&&sp.remove()};
 try{const br=document.querySelector('header .brand');if(!br||!sp||DOORM){end();return}
 const sb=br.cloneNode(true);sb.id='spb';sb.removeAttribute('href');sb.removeAttribute('onclick');sb.className='brand';sp.appendChild(sb);
 const r=br.getBoundingClientRect(),k=Math.min(2.6,innerWidth*.78/r.width);
 Object.assign(sb.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px'});
 const tx=innerWidth/2-r.width*k/2-r.left,ty=innerHeight/2-r.height*k/2-r.top;
 sb.style.transform=`translate(${tx}px,${ty}px) scale(${k})`;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{sb.classList.add('in');
  setTimeout(()=>{sb.classList.add('mv');sb.style.transform='none';sp.classList.add('go');
   setTimeout(()=>{R.classList.remove('spl');setTimeout(end,60)},820)},1300)}));
 setTimeout(end,5000)}catch(e){end()}})();

</script></body></html>
