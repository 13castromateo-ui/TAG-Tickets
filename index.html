function pwDlg(t,sub){$('#dlg').innerHTML=`<div class="dlg"><h3>${t}</h3><p class="note">${sub}</p><label for="np">Nueva contraseña (mínimo 6 caracteres)</label><div class="pw"><input id="np" type="password" autocomplete="new-password"><button type="button" class="pwb" onclick="pwTog(this)" aria-label="Mostrar u ocultar la contraseña">Mostrar</button></div><div id="npm" class="msg" role="alert"></div><div style="display:flex;gap:10px;margin-top:10px"><button class="btn ghost" onclick="$('#dlg').close()">Cancelar</button><button class="btn" style="flex:1" onclick="pwSave()">Guardar contraseña</button></div></div>`;if(!$('#dlg').open)$('#dlg').showModal()}
async function pwSave(){const v=$('#np').value,m=$('#npm');if(v.length<6){m.style.color='var(--bad)';m.textContent='Debe tener al menos 6 caracteres.';return}m.style.color='var(--mute)';m.textContent='Guardando…';
 try{const t=await sbToken();const r=await fetch(SB_URL+'/auth/v1/user',{method:'PUT',headers:{apikey:SB_KEY,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({password:v})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(sbMsg(j));m.style.color='var(--ok)';m.textContent='Listo, tu contraseña se cambió.';setTimeout(()=>{const d=$('#dlg');if(d.open)d.close()},1300)}catch(x){m.style.color='var(--bad)';m.textContent=sbMsg(x)}}
async function pwForgot(){const m=$('#oz').value.trim().toLowerCase(),am=$('#am');if(!/^\S+@\S+\.\S+$/.test(m)){am.style.color='var(--bad)';am.textContent='Escribí tu correo arriba y tocá de nuevo.';return}am.style.color='var(--mute)';am.textContent='Un momento…';
 try{const r=await fetch(SB_URL+'/auth/v1/recover',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:m,redirect_to:location.origin+location.pathname})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(sbMsg(j));am.style.color='var(--ok)';am.textContent='Si ese correo tiene cuenta, te enviamos un link para crear una contraseña nueva. Revisá tu bandeja de entrada y el spam.'}catch(x){am.style.color='var(--bad)';am.textContent=sbMsg(x)}}
async function sbHash(){const h=location.hash;if(!/access_token=|error_code=/.test(h))return '';const q=new URLSearchParams(h.slice(1));history.replaceState(null,'',location.pathname+location.search);
 if(q.get('error_code')){LOGERR=q.get('error_code')==='otp_expired'?'El link venció o ya se usó. Pedí uno nuevo con "Olvidé mi contraseña".':'No se pudo validar el link. Pedí uno nuevo.';view='orgz';return ''}
 const t=q.get('access_token'),ty=q.get('type')||'';try{const r=await fetch(SB_URL+'/auth/v1/user',{headers:{apikey:SB_KEY,Authorization:'Bearer '+t}});const u=await r.json();if(!r.ok)throw 0;sbSet({access_token:t,refresh_token:q.get('refresh_token'),expires_in:+q.get('expires_in')||3600,user:u});await sbProfile();view=ty==='recovery'?'orgz':view;return ty}catch(e){return ''}}

refund:['Política de devoluciones',()=>`
<p>Esta política explica qué pasa con tu dinero si no podés ir o si el evento cambia. Se aplica junto con los <a href="#terminos">Términos y condiciones</a> y no limita los derechos que te da la Ley 17.250 de Relaciones de Consumo.</p>
<h2>Si no podés ir</h2><p>Las entradas no tienen devolución por cambios de planes, salvo que el organizador indique otra cosa en la página del evento. Si el evento no es nominativo, podés transferir tu entrada a otra persona desde Mis TAGs.</p>
<h2>Si el evento se cancela</h2><p>Te devolvemos el total que pagaste, incluido el cargo por servicio. Te avisamos por correo y la devolución se hace al mismo medio de pago, sin que tengas que pedirla.</p>
<h2>Si el evento cambia de fecha, de lugar o de artista principal</h2><p>Tu entrada sigue valiendo para el evento modificado. Si no te sirve el cambio, podés pedir la devolución del total dentro de los 10 días corridos desde que te avisamos.</p>
<h2>Plazos</h2><p>Iniciamos la devolución dentro de los 10 días hábiles de corresponder. El tiempo hasta que la veas en tu cuenta o tarjeta depende de tu banco o del medio de pago.</p>
<h2>Entradas sin costo</h2><p>Las invitaciones y cortesías no tienen devolución porque no tienen costo.</p>
<h2>Cómo pedirla</h2><p>Comunicate ${lgCt()}, eligiendo el motivo "Devolución" e indicando el código de tu entrada.</p>`],
privacy:['Política de privacidad',()=>`
<p>En TAG cuidamos tus datos personales según la Ley 18.331 de Protección de Datos Personales y su reglamentación. Esta política explica qué datos usamos, para qué y cuáles son tus derechos.</p>
<h2>Responsable</h2><p>El responsable de la base de datos es ${lgWho()}. El organizador de cada evento recibe los datos de las personas que asisten a su evento y es responsable del uso que haga de ellos.</p>
<h2>Qué datos usamos</h2><ul><li>Nombre, correo y fecha de nacimiento, que nos das al comprar o reclamar una entrada.</li><li>Los datos de tus compras y entradas, y el registro de ingreso al evento (día y hora en que se escaneó tu QR).</li><li>Tu documento, solo si el evento pide verificar tu identidad.</li><li>Lo que nos escribís en los formularios de Ayuda o de Organizadores.</li></ul><p>Los datos de tu tarjeta los procesa directamente la empresa de pagos. TAG no guarda el número completo de tu tarjeta.</p>
<h2>Para qué los usamos</h2><ul><li>Emitir y enviarte tus entradas.</li><li>Controlar el ingreso y la edad mínima del evento.</li><li>Atender tus consultas y reclamos, y hacer devoluciones.</li><li>Prevenir fraudes y cumplir obligaciones legales e impositivas.</li><li>Enviarte novedades o publicidad, <b>solo si marcaste la casilla para recibirlas</b> (nunca viene marcada). Cada envío trae cómo darte de baja, y podés oponerte en cualquier momento.</li></ul>
<h2>Con quién los compartimos</h2><ul><li>Con el organizador del evento al que vas: nombre, correo, tipo de entrada e ingreso.</li><li>Con los proveedores que necesitamos para funcionar, que solo usan los datos para darnos su servicio:<ul><li><b>Supabase</b>: base de datos y cuentas de usuario.</li><li><b>Netlify</b>: alojamiento de la web.</li><li><b>Mercado Pago</b> u otra empresa de pagos: cobro de las entradas.</li><li>Un servicio de envío de correos: para mandarte tus entradas.</li><li><b>Google</b> (Google Fonts y Google Maps) y <b>YouTube</b>: reciben tu dirección IP cuando la web carga las fuentes, un mapa o un video.</li></ul>Algunos de estos servidores están fuera de Uruguay, por ejemplo en Estados Unidos. Al aceptar esta política consentís esa transferencia internacional, necesaria para darte el servicio.</li><li>Con las autoridades, cuando la ley lo exija.</li></ul><p>No vendemos tus datos.</p>
<h2>Cuánto tiempo los guardamos</h2><p>Mientras sean necesarios para las finalidades de arriba y durante los plazos que exijan las normas legales e impositivas. Después los eliminamos o los anonimizamos.</p>
<h2>Tus derechos</h2><p>Podés pedir <b>acceso</b> a tus datos y su <b>rectificación, actualización, inclusión o supresión</b> ${lgCt()} (en Ayuda, elegí el motivo "Mis datos personales"). Es gratis. Te respondemos dentro de los plazos que fija la Ley 18.331. Si no quedás conforme, podés presentar una denuncia ante la Unidad Reguladora y de Control de Datos Personales (URCDP).</p>
<h2>Tu navegador</h2><p>Esta web guarda en tu navegador solo lo necesario para funcionar. No usamos cookies de publicidad ni de análisis. El detalle está en la <a href="#cookies">Política de cookies</a>.</p>
<h2>Menores de edad</h2><p>Si sos menor de edad, usá TAG con autorización de tu madre, padre o tutor.</p>
<h2>Cambios</h2><p>Si cambiamos esta política, publicamos la nueva versión acá con su fecha.</p>`],
cookies:['Política de cookies',()=>`
<p>Las cookies y el almacenamiento local son pequeños datos que una web guarda en tu navegador. Esta página explica cuáles usa TAG.</p>
<h2>Lo que guardamos</h2><p>Solo usamos almacenamiento <b>necesario</b> para que la web funcione. Por eso no te pedimos que lo aceptes: sin esto no podrías comprar ni ver tus entradas.</p><ul><li><b>Tu sesión</b>: para que no tengas que ingresar cada vez.</li><li><b>Tus compras y entradas</b>: para mostrarte Mis TAGs y tus datos en la próxima compra.</li><li><b>Tus preferencias</b>: por ejemplo, el modo oscuro.</li><li><b>Control de puerta</b>: el código del evento, la identificación del celular y los ingresos guardados para trabajar sin señal (solo en los celulares del personal).</li></ul>
<h2>Lo que no usamos</h2><p>No usamos cookies de publicidad, de análisis ni de seguimiento. Si algún día las agregamos, te vamos a preguntar antes, con la opción de aceptarlas o rechazarlas, y la web va a funcionar igual si las rechazás.</p>
<h2>Servicios de terceros</h2><p>Las fuentes de letra se cargan desde Google Fonts. Algunos eventos muestran un mapa de Google Maps o un video de YouTube (en su modo de privacidad mejorada). Esos servicios reciben tu dirección IP y pueden aplicar sus propias políticas.</p>
<h2>Cómo borrarlo</h2><p>Podés borrar estos datos cuando quieras desde la configuración de tu navegador, en "Borrar datos de navegación" o "Datos de sitios". Si lo hacés, se cierra tu sesión.</p>`],
notice:['Aviso legal',()=>`
<p>Datos del titular de esta web.</p>
<ul><li><b>Titular:</b> ${LEGAL.razon||LEGAL.org}</li><li><b>Nombre comercial:</b> ${LEGAL.org}</li><li><b>RUT:</b> ${LEGAL.rut||'en trámite'}</li><li><b>Domicilio:</b> ${LEGAL.dom}</li><li><b>Contacto:</b> ${LEGAL.mail||'formulario de la sección Ayuda'}</li></ul>
<h2>Actividad</h2><p>TAG vende entradas por cuenta y orden de los organizadores de cada evento, las emite y ofrece control de acceso digital. El organizador es el responsable del evento.</p>
<h2>Condiciones</h2><p>El uso de la web y la compra de entradas se rigen por los <a href="#terminos">Términos y condiciones</a>, la <a href="#devoluciones">Política de devoluciones</a>, la <a href="#privacidad">Política de privacidad</a> y la <a href="#cookies">Política de cookies</a>. Rigen las leyes de la República Oriental del Uruguay, incluidas la Ley 17.250 de Relaciones de Consumo y la Ley 18.331 de Protección de Datos Personales.</p>`],
orgterms:['Acuerdo para organizadores',()=>`
<p>Este acuerdo rige la relación entre ${lgWho()} ("TAG") y cada persona o empresa que publica eventos en la plataforma ("el organizador"). Se acepta al crear la cuenta de organizador.</p>
<h2>1. La cuenta</h2><p>TAG aprueba las cuentas antes de que puedan crear eventos. El organizador da datos verdaderos y es responsable de quienes usan su cuenta y sus códigos, incluido el código de puerta.</p>
<h2>2. El evento</h2><p>El organizador es el único responsable de realizar el evento tal como lo publicó y de cumplir la normativa: habilitaciones, seguridad, derechos de autor, impuestos, control de edad y condiciones de ingreso. También garantiza que tiene derecho a usar las imágenes, nombres y textos que publica.</p>
<h2>3. Comisión</h2><p>TAG cobra la comisión acordada con cada organizador: un porcentaje por entrada con un mínimo. El organizador elige si el cargo lo paga quien compra o si se descuenta de la venta.</p>
<h2>4. Liquidaciones</h2><p>TAG transfiere al organizador lo recaudado, descontando la comisión, las devoluciones y los contracargos, en los plazos y a la cuenta que se acuerden.</p>
<h2>5. Cancelaciones y devoluciones</h2><p>Si el evento se cancela o cambia, el organizador avisa a TAG de inmediato. Las devoluciones a compradores siguen la <a href="#devoluciones">Política de devoluciones</a>, y su costo corre por cuenta del organizador. TAG puede retener fondos pendientes de liquidar para cubrirlas.</p>
<h2>6. Promotores e invitaciones</h2><p>Las comisiones de RRPP y promotores las acuerda y las paga el organizador. Las invitaciones y cortesías no generan comisión para TAG.</p>
<h2>7. Datos de los asistentes</h2><p>El organizador recibe datos de los asistentes solo para realizar su evento. Los trata según la Ley 18.331 y no los usa para otros fines ni los cede sin el consentimiento de cada persona. Ver la <a href="#privacidad">Política de privacidad</a>.</p>
<h2>8. Suspensión</h2><p>TAG puede pausar la venta de un evento o suspender una cuenta ante sospecha de fraude, información falsa o incumplimiento de este acuerdo.</p>
<h2>9. Ley aplicable</h2><p>Este acuerdo se rige por las leyes de la República Oriental del Uruguay. Las diferencias se resuelven ante los tribunales de Montevideo.</p>
<h2>10. Contacto</h2><p>Podés comunicarte ${lgCt()}.</p>`]};
function vLegal(k){const [t,f]=LG[k];return `<article class="legal"><h1>${t}</h1><p class="mute">Última actualización: ${LEGAL.fecha}</p>${f()}<p class="mute" style="margin-top:28px">Ver también: ${Object.entries(LGH).filter(([,v])=>v!==k).map(([h,v])=>`<a href="${h}">${LG[v][0]}</a>`).join(' · ')}</p></article>`}
function vHelp(){
 return `<h1>Ayuda</h1><p class="lead">Respuestas rápidas sobre tus entradas. Si no encontrás lo que buscás, escribinos y seguimos tu caso.</p><div style="max-width:720px">
 <details class="faq"><summary>¿Dónde está mi entrada?</summary><p>Te llega al correo que usaste al comprar. También la ves en Mis TAGs ingresando ese correo, y la podés descargar en PDF.</p></details>
 <details class="faq"><summary>No me llegó el correo</summary><p>Revisá la carpeta de spam o promociones. Si no está, entrá a Mis TAGs con el correo de la compra: ahí está tu QR.</p></details>
 <details class="faq"><summary>¿Puedo pasarle mi entrada a otra persona?</summary><p>Sí, desde Mis TAGs con el botón Transferir, salvo que el evento tenga entradas nominativas. Quien la recibe obtiene un QR nuevo y el tuyo deja de funcionar.</p></details>
 <details class="faq"><summary>¿Me devuelven el dinero si no puedo ir?</summary><p>Depende de la política de cancelaciones y devoluciones de cada evento. Si el evento se cancela, te avisamos por correo cómo sigue la devolución.</p></details>

 <details class="faq"><summary>Mi QR no pasa en la puerta</summary><p>Subí el brillo de la pantalla o mostrá el PDF. Si dice "Ya ingresó" o "Anulada", pedí ayuda al personal y escribinos con el código de la entrada.</p></details></div>
 <h2>Hacer una consulta o reclamo</h2><form class="panel" style="max-width:560px" onsubmit="supSend();return false" novalidate><div class="f2">
 <div><label for="h1">Nombre</label><input id="h1" autocomplete="name"></div><div><label for="h2">Correo</label><input id="h2" type="email" autocomplete="email"></div>
 <div><label for="h3">Código de la entrada (opcional)</label><input id="h3" placeholder="EP-XXXXXX" autocapitalize="characters"></div>
 <div><label for="h4">Motivo</label><select id="h4"><option>No recibí mi entrada</option><option>Problema con el QR</option><option>Transferencia</option><option>Devolución</option><option>Cobro o pago</option><option>Mis datos personales (ver, corregir o borrar)</option><option>Otro</option></select></div></div>
 <label for="h5">Contanos qué pasó</label><textarea id="h5" rows="4" maxlength="4000"></textarea>${consent('h6')}
 <div id="hm" class="msg" role="alert"></div><button class="btn" style="margin-top:10px">Enviar</button></form>`}
async function formSend(table,body,msgId,okTxt){const m=$('#'+msgId);m.style.color='var(--mute)';m.textContent='Enviando…';
 try{await sbReq('/rest/v1/'+table,{method:'POST',prefer:'return=minimal',body});m.style.color='var(--ok)';m.textContent=okTxt;return true}
 catch(x){m.style.color='var(--bad)';m.textContent=x.status===404||x.code==='42P01'||x.code==='PGRST205'?'Todavía no podemos recibir mensajes por acá. Probá de nuevo en unos días.':sbMsg(x);return false}}
function vf(ids,mail,cons,msgId){const g=i=>$('#'+i).value.trim(),m=$('#'+msgId);m.style.color='var(--bad)';
 if(ids.some(i=>!g(i))){m.textContent='Completá los campos obligatorios.';return null}if(!/^\S+@\S+\.\S+$/.test(g(mail))){m.textContent='Ingresá un correo válido.';return null}
 if(!$('#'+cons).checked){m.textContent='Para enviarlo necesitamos tu consentimiento.';return null}return g}
async function leadSend(){const g=vf(['l1','l3'],'l3','l7','lm');if(!g)return;
 if(await formSend('leads',{name:g('l1'),org:g('l2')||null,email:g('l3').toLowerCase(),phone:g('l4')||null,event_kind:g('l5')||null,message:g('l6')||null,consent:true},'lm','¡Gracias! Te escribimos en breve.'))['l1','l2','l3','l4','l5','l6'].forEach(i=>$('#'+i).value='')}
async function supSend(){const g=vf(['h1','h2','h5'],'h2','h6','hm');if(!g)return;
 if(await formSend('support_tickets',{name:g('h1'),email:g('h2').toLowerCase(),ticket_code:g('h3').toUpperCase()||null,reason:g('h4'),message:g('h5'),consent:true},'hm','Recibimos tu consulta. Te respondemos por correo.'))['h3','h5'].forEach(i=>$('#'+i).value='')}

const lnk=(e,k,tok)=>location.href.split('#')[0]+'#'+k+'-'+e.id+'-'+tok,tok8=()=>Math.random().toString(36).slice(2,10);
function copyTxt(v,b){try{navigator.clipboard.writeText(v).then(()=>{b.textContent='¡Copiado!';setTimeout(()=>b.textContent='Copiar',1400)})}catch(e){}}
const linkRow=v=>`<div style="display:flex;gap:8px;margin-top:6px"><input readonly value="${esc(v)}" onclick="this.select()" aria-label="Link"><button type="button" class="btn ghost sm" onclick="copyTxt(this.previousElementSibling.value,this)">Copiar</button></div>`;
async function featTog(id){const e=evOf(id);X(e).feat=!X(e).feat;try{await xSave(e)}catch(x){X(e).feat=!X(e).feat;ozMsg(sbMsg(x))}render()}
// --- links de invitación: el organizador define un cupo y comparte el link; cada invitado reclama su entrada sin pagar
function invHtml(e){const L=X(e).invs||[];return `<h3 style="font-size:18px;margin-top:14px">Links de invitación</h3><p class="note">Creá un link con un cupo (por ejemplo "Prensa", 10 lugares) y compartilo. Cada invitado entra, pone su nombre y correo, y recibe su entrada con QR sin pagar. Una por correo.</p>
 ${L.map((v,j)=>{const t=e.tandas[v.t]||{};return `<div class="panel" style="margin:8px 0;padding:12px"><div class="row" style="margin:0;padding:0"><span><b>${esc(v.name)}</b> · ${esc(catOf(t))} ${esc(t.n||'')}<br><span class="mute">Reclamadas ${v.used||0} de ${v.cap}${v.on===false?' · pausado':''}</span></span><span><button class="btn ghost sm" onclick="invSet(${e.id},${j},'tog')">${v.on===false?'Activar':'Pausar'}</button> <button class="btn ghost sm" onclick="invSet(${e.id},${j},'del')">Borrar</button></span></div>${linkRow(lnk(e,'i',v.token))}</div>`}).join('')}
 <div class="f2"><div><label for="v1">Nombre del link</label><input id="v1" placeholder="Prensa, Amigos del DJ…"></div><div><label for="v2">Entrada que reciben</label><select id="v2">${e.tandas.map((t,i)=>`<option value="${i}">${esc(catOf(t))} · ${esc(t.n)}</option>`).join('')}</select></div><div><label for="v3">Cupo</label><input id="v3" type="number" min="1" max="500" value="10"></div></div>
 <div id="verr" class="msg" style="color:var(--bad)" role="alert"></div><button class="btn" style="margin-top:10px" onclick="invAdd(${e.id})">Crear link de invitación</button>`}
const ve=m=>{$('#verr').textContent=m};
async function invAdd(id){const e=evOf(id),n=$('#v1').value.trim(),t=+$('#v2').value,c=Math.floor(+$('#v3').value||0);
 if(!n){ve('Poné un nombre al link, por ejemplo "Prensa".');return}if(!(c>=1&&c<=500)){ve('El cupo tiene que estar entre 1 y 500.');return}
 X(e).invs=[...(X(e).invs||[]),{id:mk(),name:n,t,cap:c,used:0,token:tok8(),on:true}];try{await xSave(e);gstDlg(id)}catch(x){ve(sbMsg(x))}}
async function invSet(id,j,a){const e=evOf(id),L=X(e).invs;if(a==='del')L.splice(j,1);else L[j].on=L[j].on===false;try{await xSave(e)}catch(x){}gstDlg(id)}
let INV=null;

 return `${cover(e,'big')}<h1 style="max-width:none;margin-top:18px">${esc(e.name)}</h1>
 <div class="info"><div><small>Fecha y hora</small><b>${+d} de ${MN[+m-1]} de ${y}</b><span class="mute">${e.time} hs</span></div><div><small>Lugar</small><b>${esc(e.place)}</b>${e.addr?`<span class="mute">${esc(e.addr)}</span>`:''}</div></div>
 <form class="panel" style="max-width:520px" onsubmit="invClaim();return false" novalidate><h2 style="margin-top:0">Tenés una invitación</h2><p class="note">${esc(v.name)} · ${esc(catOf(t))} ${esc(t.n||'')} · <b>sin costo</b>. ${left?`Quedan ${left}.`:''}</p>
 ${v.on===false||!left||today()>e.date?'<p class="msg">Este link de invitación ya no tiene lugares disponibles.</p>':`<label for="ia">Nombre y apellido</label><input id="ia" autocomplete="name"><label for="ib">Correo (acá te llega la entrada)</label><input id="ib" type="email" autocomplete="email">${e.minAge?`<label for="ic-d">Fecha de nacimiento</label>${dobHtml('ic')}<p class="note">Evento +${e.minAge}: te van a pedir cédula en la puerta.</p>`:''}${tycHtml('tyi',0,'Acepto los <a href="#terminos" target="_blank">Términos y condiciones</a> y la <a href="#privacidad" target="_blank">Política de privacidad</a>.')}<div id="err" class="msg" style="color:var(--bad)" role="alert"></div><button class="btn" style="width:100%;margin-top:12px">Reclamar mi entrada</button>`}</form>`}
// shortcut: el cupo y las entradas reclamadas se cuentan en este navegador, como las compras de la demo; en producción lo valida el servidor.
function invClaim(){const {e,v}=INV,t=e.tandas[v.t],n=$('#ia').value.trim(),m=$('#ib').value.trim(),d=($('#ic')||{}).value||'';
 if(!n||!/^\S+@\S+\.\S+$/.test(m)){err('Completá tu nombre y un correo válido.');return}
 if(!$('#tyi').checked){err('Para reclamarla tenés que aceptar los términos y condiciones.');return}
 const a=e.minAge?chkAge(e,d):'';if(a){err(a);return}
 if(!isDemo()){err('Un momento…');rpc('tag_claim',{p_event:e.dbid,p_inv:v.id,p_name:n,p_email:m,p_dob:d||null}).then(j=>{const k=j.tickets[0];done([{id:k.c,ev:e.id,t:tIx(e,k.t),owner:{name:n,email:m}}],m);$('#dlg').showModal();dbLoad()}).catch(z=>err(sbMsg(z)));return}
 if(S.tix.some(x=>x.inv===v.id&&x.owner.email.toLowerCase()===m.toLowerCase())){err('Ese correo ya reclamó una invitación de este link.');return}
 if((v.used||0)>=v.cap||!t||t.sold>=t.cap){err('Ya no quedan lugares en este link.');return}
 const tk={id:mk(),ev:e.id,t:v.t,face:0,owner:{name:n,email:m,dob:d},listed:false,used:false,g:1,inv:v.id,src:'invitado',ts:Date.now()};
 S.tix.push(tk);t.sold++;v.used=(v.used||0)+1;S.ledger.push({ev:e.id,k:'guest',total:0,fee:0,net:0,q:1,src:'invitado',ts:tk.ts,t:v.t,cur:e.cur||'UYU',rate:1,em:m.toLowerCase()});
 save();done([tk],m);$('#dlg').showModal();render()}

function prDlg(id){const e=evOf(id),L=e.links||[];setC(e);const sold=pid=>S.ledger.filter(l=>l.ev===id&&l.k==='primary'&&l.src===pid).reduce((a,l)=>a+(l.q||0),0);
 dlgOpen(`<div class="dlg">${dlgHead('RRPP y links de venta')}<div class="mute">${esc(e.name)}</div><p class="note">Cada RRPP, artista o influencer tiene su link. Lo que se vende por ese link queda a su nombre en Estadísticas, con su comisión.</p>
 ${L.map((l,j)=>`<div class="panel" style="margin:8px 0;padding:12px"><div class="row" style="margin:0;padding:0"><span><b>${esc(l.name)}</b>${l.on===false?' · pausado':''}<br><span class="mute">Vendió ${sold(l.id)} entradas · comisión ${l.pct||0}%</span></span><span><button class="btn ghost sm" onclick="prSet(${id},${j},'tog')">${l.on===false?'Activar':'Pausar'}</button> <button class="btn ghost sm" onclick="prSet(${id},${j},'del')">Borrar</button></span></div>${linkRow(lnk(e,'l',l.token))}</div>`).join('')||'<p class="mute">Todavía no hay RRPP cargados.</p>'}
 <div class="f2"><div><label for="r1">Nombre</label><input id="r1" placeholder="RRPP Ana, DJ Marea…"></div><div><label for="r2">Comisión por venta (%)</label><input id="r2" type="number" min="0" max="100" step="0.5" value="10"></div></div>
 <div id="err" class="msg" style="color:var(--bad)" role="alert"></div><button class="btn" style="margin-top:10px" onclick="prAdd(${id})">Agregar RRPP</button></div>`)}
